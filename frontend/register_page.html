<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-brand" aria-label="StudyFlow">
            <a class="auth-logo" href="index.html">Study<span>Flow</span></a>
            <p>Transforme pequenos momentos de estudo em progresso que permanece.</p>
            <div class="auth-art"><span class="auth-art-icon">✦</span><span>Organize o conhecimento.<br>Construa consistência.</span></div>
        </section>
        <section class="auth-card">
            <button class="auth-theme" id="theme-toggle" type="button" aria-label="Alternar tema">&#9681;</button>
            <span class="auth-kicker">Comece hoje</span>
            <h1>Crie seu espaço de estudo</h1>
            <p class="auth-subtitle">Seus decks e revisões em um só lugar.</p>
            <form id="register-form" novalidate>
                <label for="username">Nome</label>
                <input type="text" id="username" autocomplete="name" placeholder="Como podemos te chamar?" required>
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                <label for="password">Senha</label>
                <input type="password" id="password" autocomplete="new-password" placeholder="Pelo menos 6 caracteres" required>
                <label for="confirm-password">Confirmar senha</label>
                <input type="password" id="confirm-password" autocomplete="new-password" placeholder="Digite novamente" required>
                <p class="auth-error" id="error-message" role="alert"></p>
                <button class="auth-submit" id="register-submit" type="submit">Criar minha conta</button>
            </form>
            <p class="auth-switch">Já tem uma conta? <a href="login_page.html">Entrar</a></p>
        </section>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
