<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-brand" aria-label="StudyFlow">
            <a class="auth-logo" href="index.html">Study<span>Flow</span></a>
            <p>Um lugar calmo para aprender, revisar e continuar avançando.</p>
            <div class="auth-art"><i class="fa-solid fa-layer-group"></i><span>Escolha um deck.<br>Estude no seu ritmo.</span></div>
        </section>
        <section class="auth-card">
            <button class="auth-theme" id="theme-toggle" type="button" aria-label="Alternar tema">&#9681;</button>
            <span class="auth-kicker">Bem-vindo de volta</span>
            <h1>Continue seus estudos</h1>
            <p class="auth-subtitle">Entre para retomar exatamente de onde parou.</p>
            <form id="login-form" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                <label for="password">Senha</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha" required>
                <p class="auth-error" id="error-message" role="alert"></p>
                <button class="auth-submit" id="login-submit" type="submit">Entrar</button>
            </form>
            <p class="auth-switch">Ainda não tem uma conta? <a href="register_page.html">Criar conta</a></p>
        </section>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
